break_ledger:
  - id: strict-decode-default
    kind: behavior
    packages:
      - j2k
      - j2k-native
    removed_items: []
    summary: "Default decode settings and the one-shot view path are strict, and explicit leniency is limited to the documented JP2/JPH metadata recoveries rather than relaxing raw codestream or entropy validation."
    migration: "Use DecodeSettings::lenient() per job, including through J2kView::parse_with_settings or J2kDecoder::new_with_settings, only for the documented JP2/JPH metadata recoveries; malformed raw codestream or entropy data must now be rejected or repaired."
  - id: recovery-warning-semantics
    kind: behavior
    packages:
      - j2k
    removed_items: []
    summary: "Lenient decoding now emits a warning only when an explicitly permitted metadata recovery was actually used."
    migration: "Treat an empty warning list as no recovery having occurred; selecting DecodeSettings::lenient() by itself no longer produces a warning."
  - id: rename-lenient-recovery-warning
    kind: source
    packages:
      - j2k
    removed_items:
      - package: j2k
        item: "pub j2k::J2kDecodeWarning::LenientDecodeMode"
    summary: "The decode warning variant now describes actual lenient metadata recovery rather than configuration selection."
    migration: "Replace matches on J2kDecodeWarning::LenientDecodeMode with J2kDecodeWarning::LenientMetadataRecovery and handle the warning only when recovery occurred."
