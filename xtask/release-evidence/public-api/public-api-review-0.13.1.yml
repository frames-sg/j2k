    hidden_rationale: "Adds the ComponentRowSink trait and Image::decode_region_rows_for_integer_output_with_context, which hand a serial region decode's finished integer-output rows to a sink as disjoint rectangles instead of filling component planes; decodes that cannot stream hand their planes over as one rectangle. Adds window_referenced_classic_plan_to_stores and window_referenced_htj2k_plan_to_stores, which return a copy of a referenced region plan whose sub-bands and IDWT levels hold only what its stores read, or None when that would not pay off; the facade's CPU batch executes the copy while GPU backends keep the shared whole-level plan. All five items are additions; no other hidden item changed and no caller migration is required."
