  j2k-metal-support:
    removed_fingerprint: "none"
    added_fingerprint: "fnv1a64:cb0fe39460064a9f"
    hidden_count: 11
    hidden_fingerprint: "fnv1a64:02139606f1202938"
    rationale: "Compared the ordinary API with v0.12.0; existing signatures are unchanged. Also records the already-merged checked_shared_heap and checked_heap_shared_buffer allocation helpers. They preserve typed allocation failures and introduce no changes to existing signatures. Adds unsafe with_checked_buffer_slice_mut for bounded CPU writes into shared Metal storage. Its safety contract requires exclusive access with no overlapping GPU commands; the mutable view is limited to the callback."
    hidden_rationale: "Compared the hidden inventory with v0.12.0; retained implementation adapters support this package's public entry points."
  j2k-mpsgraph-support:
    removed_fingerprint: "none"
    added_fingerprint: "none"
    hidden_count: 0
