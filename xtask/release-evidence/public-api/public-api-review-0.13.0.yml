    rationale: "Compared the ordinary API with v0.12.0; existing signatures are unchanged."
    hidden_rationale: "Compared the hidden inventory with v0.12.0; retained implementation adapters support this package's public entry points."
  j2k-native:
    removed_fingerprint: "none"
    added_fingerprint: "fnv1a64:7debc570e375354a"
    hidden_count: 582
    hidden_fingerprint: "fnv1a64:56243dbdb7c7dd62"
    rationale: "Compared the ordinary API with v0.12.0; existing signatures are unchanged. Adds selected wavelet extraction and shared wavelet type re-exports. It decodes the requested entropy bands without inverse DWT or color conversion and preserves exact reversible integer coefficients; existing pixel APIs retain their signatures. Also records the already-merged irreversible_quantization_profile option. Profiles supply per-component band weights; callers using Default or struct update syntax retain the previous no-profile behavior. Exhaustive native EncodeOptions literals must add irreversible_quantization_profile: None or use struct update syntax. Adds DecodingError::IncompletePlaneStore, returned when component planes reused without zeroing are not fully written; DecodingError is non_exhaustive."
    hidden_rationale: "Adds an HT coding probe, parallel scratch toggle, and J2kClassicReconstruction hooks to the native implementation inventory. Existing classic adapters retain their defaults; supporting reversible midpoint reconstruction requires opting into the new reconstruction hooks. Also records the already-merged inverse_dwt97_reference, inverse_ict_reference, and irreversible_quantization_profile_scale_ceiling helpers. These are additive reference and profile-validation entry points. Adds irreversible_quantization_scale_bounds so facade rate search uses the same weighted-step limits as native quantization, including the HT coded-bitplane ceiling. Existing signatures and the legacy scale-ceiling helper remain compatible; no caller migration is required. irreversible_quantization_step_for_subband also takes the sub-band's decomposition level and the level count, so default 9/7 steps can be weighted by synthesis norm; callers pass both. Adds IrreversibleScaleEncoder so facade rate and PSNR search reuses one colour transform and DWT across quantization-scale candidates; each candidate equals the independent CPU encode at that scale. It is additive; no caller migration is required. Adds the ComponentRowSink trait and Image::decode_region_rows_for_integer_output_with_context, which hand a serial region decode's finished integer-output rows to a sink as disjoint rectangles instead of filling component planes; decodes that cannot stream hand their planes over as one rectangle. They are additive; existing region methods retain their signatures."
  j2k-jpeg:
    removed_fingerprint: "fnv1a64:c2093d3bff880a40"
    added_fingerprint: "fnv1a64:dc6430a33ad716c8"
    hidden_count: 701
    hidden_fingerprint: "fnv1a64:bd0cf738a0f96592"
    rationale: "Compared the ordinary API with v0.12.0; existing signatures are unchanged. Adds optimized baseline, 12-bit extended, and lossless JPEG encoders with native sample types. Exhaustive JpegEncodeError matches must handle RestartIntervalTooLarge, UnsupportedPixelFormat, UnsupportedPrecision, InvalidPredictor, InvalidPointTransform, and SampleOutOfRange. YCCK colors, lossless sample replication, and color-space inference now match the committed external references. Adds metal_hybrid_eligibility, JpegCapabilityReport::metal_hybrid, and MetalHybrid routing for explicit Metal requests. Exhaustive JpegResolvedDecodePath matches need a MetalHybrid arm; Auto routing keeps its existing choice. Adds JpegBatchDecoder, JpegBatchDecodeOptions, JpegBatchInput, JpegBatchGroup and JpegBatchDecodeResult for dense RGB8 CPU batches grouped by size. Inputs have private fields with new, with_options, bytes and options; item failures are TileBatchError<JpegError> by input index, and source_indices identifies each row because group order is unspecified. Adds the BatchLayout re-export. DecodeOptions adds with_strict, set_strict and is_strict, strict by default. JpegError gains RecoveryRequired and AmbiguousColorTransform. DecodeOutcome and DecodedTile gain recovered, and ColorTransform becomes non_exhaustive; the jpeg-outcome-recovery-field, extensible-jpeg-color-transform, jpeg-strict-completion and jpeg-required-interpretation ledger entries record the migrations."
    hidden_rationale: "Compared the hidden inventory with v0.12.0; retained implementation adapters support this package's public entry points. Adds entropy-only DCT and lossless decoding into caller storage, component geometry, lossless GPU planning/Huffman/frame assembly contracts, and a reduced-IDCT benchmark helper. Existing adapter signatures are preserved; the new adapters validate dimensions, precision, ranges, and allocation bounds before execution. Removes the unreferenced bench_idct_neon_bottom_half_zero_block benchmark wrapper; the NEON bottom-half-zero IDCT stays reachable through BenchNeonIdct::run_bottom_half_zero."
  j2k-tilecodec:
    removed_fingerprint: "none"
    added_fingerprint: "none"
    hidden_count: 32
    hidden_fingerprint: "fnv1a64:eb677842559d9b0e"
    rationale: "The ordinary j2k-tilecodec API is unchanged from v0.12.0. The standard I/O error rustdoc path adjustment already shipped in 0.12.0."
    hidden_rationale: "Compared the hidden inventory with v0.12.0; retained implementation adapters support this package's public entry points."
  j2k:
    removed_fingerprint: "fnv1a64:ffea85eb442c661d"
    added_fingerprint: "fnv1a64:6d29f512d27db446"
    hidden_count: 108
    hidden_fingerprint: "fnv1a64:01e74ad6c3ff416e"
    rationale: "Compared the ordinary API with v0.12.0; existing signatures are unchanged. Adds J2kDecoder::decode_wavelets and shared wavelet type re-exports. Reduced decode requests beyond the main or tile resolution ladder now return an error rather than silently clamping; owned batches report invalid requests with their input index during preparation. Callers must choose an available reduction level. Also records the already-merged quantization_profile field and with_quantization_profile builder on the non-exhaustive lossy options type. Existing builders keep the no-profile default. Adds CpuBatchDecoder::decode_tiles_into, retained_tile_batch_workspace_bytes, release_tile_batch_workspaces, and the non_exhaustive J2kToHtj2kOptions::coefficient_only field with with_coefficient_only. BatchLayout now comes from j2k-core and stays re-exported at the j2k root, so the BatchDecodeOptions::layout and BatchGroupInfo::layout field types render through the j2k-core defining path. BatchDecodeOptions becomes non_exhaustive with layout, settings and workers retained. The shared-batch-layout and extensible-batch-options ledger entries record the migrations."
