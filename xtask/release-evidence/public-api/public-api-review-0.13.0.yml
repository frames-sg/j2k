    hidden_fingerprint: "fnv1a64:57c61a4568990ce6"
    rationale: "Compared the ordinary API with v0.12.0; existing signatures are unchanged."
    hidden_rationale: "Adds CudaDeviceBuffer::destination_view_mut and CudaExternalDeviceBufferViewMut::sub_view_mut, which borrow an owned allocation or a sub-range of a view as an exclusive destination view. Existing upload signatures are unchanged from v0.12.0."
  j2k-cuda-j2k-engine:
    removed_fingerprint: "none"
    added_fingerprint: "none"
    hidden_count: 692
    hidden_fingerprint: "fnv1a64:684fbcddde38e1f1"
    rationale: "Compared the ordinary API with v0.12.0; existing signatures are unchanged."
    hidden_rationale: "Adds origin-aware 5/3 and 9/7 DWT methods to the j2k-cuda-j2k-engine implementation inventory. Existing methods still use origin zero and retain their signatures. Payload-slice uploads and cleanup retained-byte arguments already shipped in 0.12.0. Adds signed to CudaJ2kStoreGray16Job and CudaJ2kStoreRgb16Job, and native_samples to CudaJ2kStoreGray8Target and CudaJ2kStoreGray16Target, so device stores follow CPU sample conversion for signed sources. j2k_quantize_subband_region_resident is replaced by j2k_quantize_subband_regions_resident, which takes an ordered slice of sub-band regions and the caller's device buffer pool, and j2k_quantize_subband_regions_resident_into, which writes the regions into a checked coefficient prefix of an existing buffer; resident coefficient results expose into_buffer for recycling. Removes the unused CudaJ2kMl conversion types and J2kCudaEngine::j2k_ml_convert_into_external together with the cuda-oxide-j2k-ml feature. The source-breaking hidden changes are recorded in the cuda-engine-store-and-quantize-contracts and removed-cuda-oxide-j2k-ml ledger entries."
  j2k-cuda-jpeg-engine:
    removed_fingerprint: "none"
    added_fingerprint: "fnv1a64:103e0c647d4cb39d"
    hidden_count: 205
    hidden_fingerprint: "fnv1a64:ad37da6966da1cfd"
    rationale: "Adds the lossless category count and encode_lossless_with_external_live entry point; existing engine calls keep their signatures."
    hidden_rationale: "Adds the C-layout lossless parameter block, borrowed input job, and packed-stream or sample-range outcome. The new path validates buffer ranges, alignment, geometry, and retained host allocation before launching CUDA-Oxide kernels. The JpegCudaEngine impl marker moves from the hidden inventory to the ordinary inventory when the lossless method becomes public; this does not remove the engine."
