    added_fingerprint: "fnv1a64:5d2f27924d0d36ee"
    hidden_count: 111
    hidden_fingerprint: "fnv1a64:6eaf63f068893d17"
    rationale: "Compared the ordinary API with v0.11.3; existing signatures are unchanged. Adds CPU wavelet selection and output types for tiles, components, resolutions, and orientations. Reversible samples are I64 and irreversible samples are dequantized F32; geometry, precision, sampling, transform, and quantization metadata travel with the bands. Adds defaulted encode_forward_dwt53_at_origin and encode_forward_dwt97_at_origin hooks. Existing job structs and zero-origin hooks are unchanged; default implementations call legacy hooks only for equivalent phases and decline other phases. Adds the defaulted declines_every_stage method: true permits native encode to skip the remaining per-stage hooks of the current encode, asked after begin_encode and after the whole-tile hooks decline, along with the inputs only those hooks read; the default false keeps existing accelerators on their current path. Adds J2kDirectGrayscalePlan::signed so retained component plans carry source signedness. The maintainer approved this source-breaking field addition for 0.13.0. Exhaustive struct literals must add signed from source metadata or use struct update syntax with an existing plan that has the correct signedness."
    hidden_rationale: "Compared the hidden inventory with v0.11.3; retained implementation adapters support this package's public entry points. Adds subband-origin, phase-aware dimension, and zero-anchored grid helpers plus default accelerator implementations. Also records the already-merged tiled_decomposition_levels helper; it retains the smallest-edge depth policy. CpuOnlyJ2kEncodeStageAccelerator overrides declines_every_stage to return true, since all of its hooks decline."
