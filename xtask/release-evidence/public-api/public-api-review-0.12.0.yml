break_ledger:
  - id: rustdoc-io-error-path
    kind: "source"
    packages: ["j2k-tilecodec"]
    removed_items: [{"package": "j2k-tilecodec", "item": "pub j2k_tilecodec::TileCodecError::Io::source: std::io::error::Error"}, {"package": "j2k-tilecodec", "item": "pub j2k_tilecodec::TileCodecError::Malformed::source: std::io::error::Error"}]
    summary: "The pinned rustdoc inventory now renders the standard I/O error type through core::io instead of std::io."
    migration: "Continue passing std::io::Error; these are re-export paths for the same type and require no source change."
  - id: cuda-upload-and-cleanup-contract
    kind: "behavior"
    packages: ["j2k-cuda-j2k-engine"]
    removed_items: []
    summary: "The rustdoc-hidden CUDA upload entry points accept payload parts, and cleanup groups track capacity and retained host bytes; these signature changes are recorded in the hidden inventory."
    migration: "Pass &[payload] for a single payload to upload_j2k_decode_payload_with_pool and upload_htj2k_decode_resources_with_tables_and_pool. Supply cleanup_capacity and live_host_bytes to CudaQueuedHtj2kCleanupGroup::new as documented in the 0.12.0 API."
  - id: cuda-pooled-surface-lifetime
    kind: "behavior"
    packages: ["j2k-cuda"]
    removed_items: []
    summary: "Dropping pooled RGB8/RGBA8 CUDA output returns memory to the session pool without synchronizing."
    migration: "Keep each surface alive until every consumer stream has finished using device_ptr. Synchronize or retain the surface until downstream work completes."
