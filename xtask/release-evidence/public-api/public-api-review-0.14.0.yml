  j2k:
    removed_fingerprint: "none"
    added_fingerprint: "fnv1a64:cab0de4e83445d14"
    hidden_count: 133
    hidden_fingerprint: "fnv1a64:2ef592c8e7d08282"
    rationale: "Compared the complete ordinary API inventory against v0.13.1. Adds J2kError::ResourceLimit { requested, cap, source } to an already non-exhaustive enum; no existing item changes and existing variant discriminants are preserved. Budget and image-size failures now use this variant instead of NativeDecode, retaining the structured native cause. Callers specifically handling budget failures through NativeDecode should also handle ResourceLimit. Batches prepared by CpuBatchDecoder report items whose output allocation or planned execution cannot fit as indexed preparation errors and exclude those items from the prepared groups. Backend-neutral prepare_batch and prepare_batch_from_images retain whole-call output-cap failures for a single oversized image when subsequently decoded on the CPU. On either preparation path, groups whose combined output exceeds the allocation cap are decoded into several result groups, each with a buffer within the cap. Automatic streamed routes also allow requests that previously exceeded working-memory limits to succeed. The documented deep-sample conversion fixes make 16-bit outputs of images deeper than 16 bits hold the native sample value clamped to the 16-bit range (two's complement when signed), as scaled decodes already did, and quantize 8-bit outputs over the full component precision, correcting the prior wider-sample byte interpretation and 16-bit scaling ceiling. These preserve the output contracts and ordinary decode signatures. Adds BackendErrorKind::Decode at the end of its existing non-exhaustive enum and BackendError::decode for failures during backend decode execution. Existing discriminants and constructors are preserved. The public error documentation and changelog describe the refinements. Adds the non-exhaustive J2kReferenceGrid with J2kView::reference_grid, J2kDecoder::reference_grid and J2kDecoder::inspect_reference_grid, which report the SIZ image and tile origins, and DeviceDecodePlan::for_reference_grid and DeviceDecodePlan::reduced_image_dims, which size reduced outputs on the reference grid; DeviceDecodePlan::for_image keeps its signature and behavior for images at a scale-aligned origin. Reduced-resolution decodes of images whose origin is not a multiple of the scale now cover the reduced samples the standard places under the request, as OpenJPEG does, instead of failing (exact-level methods) or returning ceil(size / s) samples (batches): this corrects output, not a signature. Adds J2kSrgb8Image::warnings; decode_srgb8 of Gray, RGB and RGBA images without an ICC profile now takes decode_into's route, and bounded row decodes and lenient batch preparation now report and apply the lenient recoveries their settings allow. Adds BatchDecodeOptions::max_working_memory_bytes to the already non-exhaustive options struct (None keeps the default policy), and J2kDecoder::full_decode_plan and J2kDecoder::rows_decode_plan with the non-exhaustive J2kDecodePlan, J2kDecodeRoute and J2kStreamingBlocker, which report a decode's planned route and why its rows cannot stream before decoding. Adds J2kDecoder::inspect_support_with_settings, which inspects support metadata with the JP2/JPH recoveries the given settings allow, as J2kDecoder::new_with_settings parses; inspect_support keeps its strict behavior. J2kError and NativeBackendError also implement Clone (derived implementations are omitted by the simplified inventory). Decode and header errors remain inline; opaque encode and resident-encode failures share their original sources through Arc and are excluded from heap-free batch normalization. Receiving CPU sessions reapply admission to reused prepared images without changing shared codec facts. Adds max_reduction_levels and region_decode_plan, the non-exhaustive J2kRegionDecodePlan/J2kSampleInterpretation metadata, and checked padded buffer_len. Geometry remains reference-grid exact; queries validate effective component/tile ladders, supported native sample layouts and no-sample regions before output allocation. Existing request types, Downscale meanings and decode signatures remain unchanged. Empty source regions now return InvalidRegion consistently with native validation. Adds exact region sRGB planning/decoding and J2kSrgb8Image::alpha, with explicit straight-alpha output. Standard sRGB-equivalent ICC input is recognized by ordinary packed paths; premultiplied colour is unassociated at the source precision before sYCC conversion and quantization, and premultiplied CIE Lab or subsampled non-eight-bit inputs are rejected rather than producing incorrect colour. Adds non-exhaustive J2kDecodeControl, clone-shared J2kCancellationToken and Cancelled on the existing non-exhaustive error enum. Controlled packed/sRGB operations enforce their documented working/output domains and cooperative checkpoints; raw native error sources remain intact, and ambiguous requested-byte counts are reported as unknown. ICC classification/conversion under a working cap charges a bound on the pinned colour-management state for XYZ-connection matrix/TRC and gray-TRC profiles and rejects other profiles under a cap; ICC text tags are no longer parsed, so they cannot amplify parse memory. Adds PreparedImageOperation and CpuBatchDecoder::decode_operations for source-coordinate exact reductions without changing PreparedImage::plan or JPEG Downscale semantics. PreparedImage::reference_grid exposes an existing immutable fact. Source validation/sample interpretation is preserved; receiving CPU sessions derive admission afresh. Borrowed preparation and owned derivative caches expose bounded retention/statistics; caller-owned compressed input/source preparation remain separate from operation-owned plans, scratch and outputs. Existing APIs and result ownership remain available. The additions are opt-in and need no source migration. J2kRegionDecodePlan also reports packed BatchAlpha explicitly: ordinary RGBA retains source convention, opaque fill and normalized RGBA are straight, and layouts without alpha report None without changing their colour values. Projected resource-limit messages show the effective working cap while preserving the raw typed engine source. These are additive metadata and diagnostic refinements; pixel and ownership contracts remain unchanged. Adds J2kView::parse_with_control, J2kDecoder::new_with_control, J2kDecoder::max_reduction_levels_with_control, J2kDecoder::srgb8_region_decode_plan_with_control and CpuBatchDecoder::prepare_with_control, which run source parsing, planning and batch preparation under a J2kDecodeControl's working limit, output limit and cancellation. Controlled batch preparation is serial so the working limit bounds each input beside the plans already retained for earlier inputs; failures are indexed preparation errors. Prepared decoders and batches retain only their actual plans, never the control's allowance. The uncontrolled constructors and prepare keep their signatures and behavior; the additions are opt-in and need no migration. Adds exact-operation planning for bindings: CpuBatchDecoder::plan_operations returns each operation's PreparedOperationPlan (output contract, covered rectangle, lenient recovery) or the error its decode reports, from the preparation decode_operations uses; J2kDecoder::native_region_decode_plan and native_region_decode_plan_with_control return a J2kNativeRegionDecodePlan (packed region plan and native sample contract with signedness); EncodedImage::operation_source constructs an exact-operation source; and J2kSrgb8Image::into_planar_data_with_control stores sRGB channels as planes within a working limit. The new structs are non-exhaustive; these are additions only, and no existing signature changes. Adds J2kFileMetadata::primary_color_spec and J2kFileMetadata::icc_profile, which return the Colour Specification box decoding applies (the first in file order, per ISO/IEC 15444-1 I.5.3.3) and its ICC profile, so the C and Python bindings report applied colour from the facade; has_icc_profile keeps its any-box meaning. These are additive accessors over existing metadata and need no migration. Adds J2kDecoder::inspect_coding_style with the non-exhaustive J2kCodingStyle (J2kProgressionOrder, quality layers, decomposition levels and code-block size from the main-header COD marker) and J2kReferenceGrid::reduced_area, the ITU-T T.800 B.5 window [ceil(x0 / 2^r), ceil(x1 / 2^r)) of a full-resolution region at a reduction, beside reduced_region's covering of overlapping samples. They give the CLI's opj_decompress interface and the Python binding the facts an image server needs from the facade; both are additions and no existing signature or decode output changes."
    hidden_rationale: "Adds set_full_decode_planes_budget as an unsupported test hook for isolated integration tests of automatic planes/streamed routing. This hidden hook adds no supported routing configuration. Adds BatchGroupInfo::classify_native_output so borrowed binding queries reuse the existing native type, alpha and layout classifier without copying compressed input or preparing packet plans. Geometry and execution validation remain in the existing planners. Adds prepare_device_operations with the PreparedDeviceOperations, PreparedDeviceOperationGroup and PreparedDeviceOperation views so sibling accelerator crates prepare PreparedImageOperation batches through the same exact-reduction geometry, admission, retained-memory checks and output grouping as CpuBatchDecoder::decode_operations; the views only expose the prepared plans and immutable facts device adapters need. Controlled operations apply their output limits and cancellation there, group only with operations sharing a cancellation token, and PreparedDeviceOperationGroup::check_cancelled lets device adapters stop before allocating or committing a group; working limits are rejected as unsupported rather than ignored. These are unsupported implementation helpers. No hidden signatures are removed or changed."
  j2k-transcode:
    removed_fingerprint: "none"
    added_fingerprint: "fnv1a64:a22f2d7c22e63869"
    hidden_count: 466
    hidden_fingerprint: "fnv1a64:0b451278be70016c"
    rationale: "Compared the complete ordinary API inventory against v0.13.1. Adds the non-exhaustive TranscodePrecision enum (F32, the default, and F64), re-exported at the crate root, and DctToWaveletStageAccelerator::check_dwt97_precision, a provided trait method whose default accepts every precision, so existing accelerator implementations compile unchanged. The irreversible 9/7 transcode now defaults to canonical binary32 arithmetic that CPU, Metal and CUDA reproduce byte for byte; lossy 9/7 output bytes therefore change for some inputs (19 of the 60 pinned matrix outputs, all with unchanged lengths; worst measured PSNR change -0.0019 dB). TranscodePrecision::F64 is the explicit CPU-only opt-in that reproduces the 0.13 binary64 output byte for byte. No existing item is removed or changed."
    hidden_rationale: "Adds the public JpegToHtj2kOptions::precision field (defaulting to TranscodePrecision::F32 in every constructor), the TranscodePrecision enum and its F32 and F64 variants, and the check_dwt97_precision method on the trait, CpuOnlyDctToWaveletStageAccelerator and RayonReversibleDwt53Accelerator, as listed by the implementation inventory. Code that builds JpegToHtj2kOptions with a struct literal must add precision or use ..JpegToHtj2kOptions::lossy_97() or another constructor; constructor users need no change. No hidden signatures are removed or changed."
