  j2k-native:
    removed_fingerprint: "none"
    added_fingerprint: "fnv1a64:87ad5a9891814775"
    hidden_count: 646
    hidden_fingerprint: "fnv1a64:37c71a98d6f521a0"
    rationale: "Compared the complete ordinary API inventory against v0.13.1. Adds DecodeErrorClass::ResourceLimit { requested, cap } to an already non-exhaustive enum; no existing item changes and existing variant discriminants are preserved. AllocationTooLarge and ImageTooLarge now classify as ResourceLimit instead of the generic Backend class. This is a compatible refinement of the extensible error taxonomy: invalid-input and allocator-failure classes stay unchanged. Callers that want to handle memory limits separately can match the new variant; existing wildcard matches remain valid. Adds inspect_j2k_reference_grid and the non-exhaustive J2kCodestreamReferenceGrid it returns, a sibling of inspect_htj2k_capabilities that reports the SIZ image and tile origins the existing J2kCodestreamHeaderMetadata omits; that struct's layout is unchanged. Adds DecodingError::SinkStopped to the already non-exhaustive enum, the error a streamed region decode returns when its row sink asks it to stop; existing variants and wildcard matches are unaffected. Adds Cancelled at the end of the existing non-exhaustive DecodingError and DecodeErrorClass enums for cooperative native operations. Existing variants and wildcard handling remain valid; no ordinary signatures are removed or changed. Adds Image::ignored_components, which counts the trailing codestream components that a JP2 without a channel definition box leaves unspecified (ISO/IEC 15444-1 I.5.3.6) and that decoded components, planes and bitmaps omit. Strict decoding of such a JP2 now keeps its declared colour space instead of reinterpreting it from the component count, so an sRGB JP2 over four components decodes as RGB rather than failing as CMYK; lenient decoding still infers alpha for one extra component and raw codestreams keep their component-count interpretation. This corrects output for those files without changing any signature. Adds inspect_j2k_coding_style with the non-exhaustive J2kCodestreamCodingStyle (progression order, quality layers, decomposition levels and code-block size from the main-header COD marker), parsed from the headers inspect_j2k_reference_grid already reads and validated with the decoder's code-block limits, so the facade can report the coding style without decoding. This is an addition only; no existing signature changes."
    hidden_rationale: "Adds referenced_classic_plan_execution_bytes and referenced_htj2k_plan_execution_bytes for sibling CPU batch adapters to check planned live execution memory before allocation. For the facade's streamed routes, j2k-native also adds decode_native_region_components_rows_with_context, full_decode_planes_floor, output_tile_rects, region_decode_streams_rows and streamed_rows_native_precision; cpu_decode_pool_threads reports the pool thread count for facade routing, DecoderContext::set_shared_pool marks CpuBatchDecoder's shared-pool images, and pack_rgb8 shares the existing pixel conversion. ComponentRowSink::rgb8_region is an optional default method, so existing sink implementations remain valid. Image::image_origin and Image::tile_grid report the SIZ origins the facade needs to size reduced outputs on the reference grid, and inspect_jp2_container_with_settings applies a decode's lenient container recoveries so facade batch preparation plans from the metadata a lenient decode uses; inspect_jp2_container keeps its strict behavior. ComponentRowSink::stopped is an optional default method returning false, so existing sinks remain valid, through which facade sinks that failed stop a streamed decode at its next hand-over. Image::region_rows_blocker and the non-exhaustive RegionRowsBlocker name the condition region_decode_streams_rows fails, which is now derived from them, and decode_region_rows_for_integer_output_with_retained_baseline charges memory concurrent tile decodes hold so they share one decode budget. at_simd_level, round_clamped_native, signed_native_bounds and unsigned_native_max share dispatched sample conversion and its bounds with sibling crates. Image::new_with_reduction_and_retained_baseline combines existing exact-reduction parsing and aggregate retained-memory enforcement for CUDA preparation; the original constructors and their signatures remain available. These are unsupported implementation helpers; existing signatures are unchanged. Adds max_reduction_levels, region_rows_plan and validate_region_sample_layout so facade queries share effective tile/header capabilities, the native execution route decision and precision/layout checks without allocating decoded samples. Existing native entry points and partial-header signatures remain unchanged; complete exact reduction accepts valid upward tile overrides while preserving unavailable-reduction errors. Adds scoped DecodeOperationControl and context access, restoration, capacity reporting and optional-owner release helpers for sibling operation adapters. Controlled parsing, effective-reduction/region/bitmap planning and full-route metadata scans preserve exact geometry and account live owners without caching policy. The retained-capacity region bitmap entry and accounted classic/HT plan-window functions charge output and copy peaks. alpha_is_premultiplied shares factual source association; srgb8_alpha_is_premultiplied separately validates mapped precision and colour-conversion eligibility before normalization. Native sample output remains unchanged. These additions keep source facts separate from operation policy; existing hidden signatures are preserved. Image::keep_ignored_components restores every codestream component to decoded output so facade recode re-encodes the whole codestream; it is an unsupported implementation helper and changes no existing signature. sample_as_u8_native converts a native sample of any precision to 8 bits over its component's range, so direct-CPU colour plans and the facade's 8-bit output share one conversion instead of saturating samples deeper than 16 bits; it changes no existing signature. inspect_jp2_container_with_operation_control inspects JP2/JPH boxes as inspect_jp2_container_with_settings does, within one operation's working allowance and with its cancellation checkpoints, so controlled facade parsing bounds container metadata; the uncontrolled inspectors are unchanged. DecoderContext::with_straight_alpha_output scopes one decode whose output undoes premultiplied alpha in source code values, after palette mapping and channel reordering and before native colour conversion or quantization, and Image::unassociates_alpha_in_source_values reports when that applies (unsigned components on one sampling grid, no CIE Lab conversion), so facade sRGB normalization no longer quantizes before unassociation. srgb8_alpha_is_premultiplied now accepts those sources at any precision, including sYCC; ordinary native output and all existing signatures are unchanged."
  j2k-jpeg:
    removed_fingerprint: "none"
    added_fingerprint: "fnv1a64:f61e3d83f19f962d"
    hidden_count: 735
    hidden_fingerprint: "fnv1a64:ec777d18cfbd1c9f"
    rationale: "Adds DctWindowOutOfBounds and InvalidDctExtractOptions to the non-exhaustive JpegError enum for caller-input validation of windowed DCT extraction. Existing signatures and exhaustive JpegEncodeError variants are unchanged; metadata errors use its existing InvalidDctImage variant. No caller migration is required."
    hidden_rationale: "Adds bench_support::bench_huffman_scan behind bench-internals for entropy-only measurements. Rustdoc also records the JpegFastPacketFamily inherent impl used by the shared streaming routes; its methods remain crate-private. Adds quantized_only and estimate to DctExtractOptions, with retain_dequantized_blocks on that non-exhaustive struct; existing default and dequantized_only behavior is preserved. Adds MCU-window extraction, extraction working-set estimates, a baseline writer with source metadata, and standalone lossless crops under the experimental transcode module. InvalidMetadata extends the non-exhaustive JpegDctImageError enum. Baseline quantized-only windows are estimated and admitted without the whole-image coefficient matrix they never allocate; progressive and multi-scan windows retain whole-image coefficient accumulation, reflected in the estimate. Existing extraction and canonical re-emission signatures and behavior are unchanged."
