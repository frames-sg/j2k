    rationale: "Compared the complete ordinary API inventory against v0.13.1. Adds MetalBatchDecoder::decode_operations and MetalBatchDecoder::submit_operations, which decode j2k PreparedImageOperation batches (exact reductions 0 to 31 over source-coordinate regions) on Metal with the CPU decoder's geometry, grouping and per-item errors; a J2kDecodeControl's output limit and cancellation apply, with cancellation checked before each group's allocation and commit, and a working limit is reported as a per-item unsupported error before any submission. Operation plans are cached under their own keys and never reuse the source's prepared plan. These are additive methods; no inventoried signatures or error variants were removed or changed. Error and NativeBackendError additionally implement Clone (derived implementations are omitted by the simplified inventory), allowing repeated and distinct batch completions to preserve the original variants, classification predicates and source chains. Decode sources stay inline; opaque encode sources are shared through Arc. Classic and HT Tier-1 FAIL statuses use Error::Decode(J2kError::Backend) with BackendErrorKind::Decode, retaining coding path, status, detail and source index. Pre-execution UnsupportedPlan rejections permit another applicable route; post-execution failures remain terminal and are not silently retried. Auto execution preserves the supplied reusable session, including its command queue. These correct existing behavior without changing public request or submission signatures."
    hidden_rationale: "Adds MetalBatchDecoder::submit_operation_group_into, which decodes one j2k PreparedDeviceOperationGroup into a caller-owned MetalImageDestination for sibling binding crates (the Python MPS backend) that allocate their own resident tensors; it shares the submission, ordering and error contracts of the existing prepared-group destination path. It is an unsupported implementation helper; existing hidden signatures are unchanged."
