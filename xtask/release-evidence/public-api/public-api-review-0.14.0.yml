  j2k-codec-math:
    removed_fingerprint: "none"
    added_fingerprint: "fnv1a64:12fb414ba1dc4022"
    hidden_count: 0
    hidden_fingerprint: "none"
    rationale: "Adds 65 JPEG items shared by the CPU, Metal and CUDA backends. 43 are ISLOW constants and transform helpers: reduced-size coefficients, shifts, gain tables, 1-D and block transforms, rounding and sample conversion. 22, including the modules jpeg::fdct and jpeg::upsample, make the baseline codecs byte-identical across backends: the integer forward DCT and quantization (jpeg::fdct: FRACTION_BITS, BASIS_HIGH, BASIS_LOW, fdct_quantize, fdct_quantize_coefficient), the forward RGB to YCbCr transform (jpeg::ycbcr: FRACTION_BITS, eight forward weights, rgb_to_y, rgb_to_cb, rgb_to_cr), and libjpeg fancy chroma upsampling (jpeg::upsample: h2v1_fancy, h2v2_column_sum, h2v2_fancy). Adds 4 GPU-parity owners: htj2k::MEL_EXPONENTS, the MEL run-length exponent table the HTJ2K encoders and decoders share, and the generated Metal fragments generated::CLASSIC_TABLES_METAL (classic Tier-1 MQ and context tables), generated::HTJ2K_CONSTANTS_METAL (MEL exponents and the HT scratch limit) and generated::MCT_CONSTANTS_METAL (ICT coefficients), rendered from the Rust owners by cargo xtask codec-math-codegen. Adds the transcode97 module, the canonical binary32 specification of the JPEG-to-HTJ2K irreversible 9/7 transcode that the CPU, Metal and CUDA backends evaluate bit for bit: the Transcode97Arithmetic trait (fma, mul, add primitives a backend supplies with single rounding), the IDCT8_COS_F32, IDCT8_BASIS_F32, DWT97_LIFT_STEPS_F32, DWT97_LOW_SCALE_F32 and DWT97_HIGH_SCALE_F32 constants, and the no_std, allocation-free idct8_dot, idct8x8, lift97_update, forward_lift97, quantize97 and quantize97_inv_delta functions that fix the operation order. Adds the roi module with roi_maxshift_is_region, the Maxshift region test (a coefficient belongs to the region when its magnitude reaches 2^shift) that the native reversible and irreversible decoders and the CUDA classic and HTJ2K kernels share and the Metal shader mirrors. Existing constants keep their names, types and values; no existing item is removed or changed."
