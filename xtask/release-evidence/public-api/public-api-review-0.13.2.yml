    hidden_fingerprint: "fnv1a64:d63da58635d2b8d9"
    rationale: "Compared the complete ordinary API inventory against v0.13.1. Adds DecodeErrorClass::ResourceLimit { requested, cap } to an already non-exhaustive enum; no existing item changes and existing variant discriminants are preserved. AllocationTooLarge and ImageTooLarge now classify as ResourceLimit instead of the generic Backend class. This is a compatible refinement of the extensible error taxonomy: invalid-input and allocator-failure classes stay unchanged. Callers that want to handle memory limits separately can match the new variant; existing wildcard matches remain valid. Adds Image::ignored_components to report trailing unspecified JP2 components omitted from decoded output. A declared color space without a channel definition box now keeps its color interpretation when extra components are present. Existing signatures are unchanged; lenient alpha inference and raw-codestream interpretation remain unchanged. No caller migration is required."
    hidden_rationale: "Adds referenced_classic_plan_execution_bytes and referenced_htj2k_plan_execution_bytes for sibling CPU batch adapters to check planned live execution memory before allocation. For the facade's streamed routes, j2k-native also adds decode_native_region_components_rows_with_context, full_decode_planes_floor, output_tile_rects, region_decode_streams_rows and streamed_rows_native_precision; cpu_decode_pool_threads reports the pool thread count for facade routing, DecoderContext::set_shared_pool marks CpuBatchDecoder's shared-pool images, and pack_rgb8 shares the existing pixel conversion. ComponentRowSink::rgb8_region is an optional default method, so existing sink implementations remain valid. These are unsupported implementation helpers; existing signatures are unchanged. Adds Image::keep_ignored_components for recoding and its round-trip validation to retain and compare all codestream components, including unspecified extras. This is an unsupported implementation helper; no existing hidden signature changes."
