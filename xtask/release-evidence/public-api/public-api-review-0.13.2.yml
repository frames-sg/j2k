  j2k:
    removed_fingerprint: "none"
    added_fingerprint: "fnv1a64:6608c77e01b4a14d"
    hidden_count: 109
    hidden_fingerprint: "fnv1a64:0427dd567531c8dd"
    rationale: "Compared the complete ordinary API inventory against v0.13.1. Adds J2kError::ResourceLimit { requested, cap, source } to an already non-exhaustive enum; no existing item changes and existing variant discriminants are preserved. Budget and image-size failures now use this variant instead of NativeDecode, retaining the structured native cause. Callers specifically handling budget failures through NativeDecode should also handle ResourceLimit. Batches prepared by CpuBatchDecoder report items whose output allocation or planned execution cannot fit as indexed preparation errors and exclude those items from the prepared groups. Backend-neutral prepare_batch and prepare_batch_from_images retain whole-call output-cap failures for a single oversized image when subsequently decoded on the CPU. On either preparation path, groups whose combined output exceeds the allocation cap are decoded into several result groups, each with a buffer within the cap. Automatic streamed routes also allow requests that previously exceeded working-memory limits to succeed. The documented deep-sample conversion fixes make 16-bit outputs of images deeper than 16 bits hold the native sample value clamped to the 16-bit range (two's complement when signed), as scaled decodes already did, and quantize 8-bit outputs over the full component precision, correcting the prior wider-sample byte interpretation and 16-bit scaling ceiling. These preserve the output contracts and ordinary decode signatures. Adds BackendErrorKind::Decode at the end of its existing non-exhaustive enum and BackendError::decode for failures during backend decode execution. Existing discriminants and constructors are preserved. The public error documentation and changelog describe the refinements. Adds the non-exhaustive J2kReferenceGrid with J2kView::reference_grid, J2kDecoder::reference_grid and J2kDecoder::inspect_reference_grid, which report the SIZ image and tile origins, and DeviceDecodePlan::for_reference_grid and DeviceDecodePlan::reduced_image_dims, which size reduced outputs on the reference grid; DeviceDecodePlan::for_image keeps its signature and behavior for images at a scale-aligned origin. Reduced-resolution decodes of images whose origin is not a multiple of the scale now cover the reduced samples the standard places under the request, as OpenJPEG does, instead of failing (exact-level methods) or returning ceil(size / s) samples (batches): this corrects output, not a signature. Adds J2kSrgb8Image::warnings; decode_srgb8 of Gray, RGB and RGBA images without an ICC profile now takes decode_into's route, and bounded row decodes and lenient batch preparation now report and apply the lenient recoveries their settings allow. Adds BatchDecodeOptions::max_working_memory_bytes to the already non-exhaustive options struct (None keeps the default policy), and J2kDecoder::full_decode_plan and J2kDecoder::rows_decode_plan with the non-exhaustive J2kDecodePlan, J2kDecodeRoute and J2kStreamingBlocker, which report a decode's planned route and why its rows cannot stream before decoding. Adds J2kDecoder::inspect_support_with_settings, which inspects support metadata with the JP2/JPH recoveries the given settings allow, as J2kDecoder::new_with_settings parses; inspect_support keeps its strict behavior."
    hidden_rationale: "Adds set_full_decode_planes_budget as an unsupported test hook for isolated integration tests of automatic planes/streamed routing. Existing public decode methods continue choosing their routes automatically; no supported user configuration is added. All other hidden facade items are unchanged."
