  j2k:
    removed_fingerprint: "none"
    added_fingerprint: "fnv1a64:78b9622111db3437"
    hidden_count: 109
    hidden_fingerprint: "fnv1a64:0427dd567531c8dd"
    rationale: "Compared the complete ordinary API inventory against v0.13.1. Adds J2kError::ResourceLimit { requested, cap, source } to an already non-exhaustive enum; no existing item changes and existing variant discriminants are preserved. Budget and image-size failures now use this variant instead of NativeDecode, retaining the structured native cause. Callers specifically handling budget failures through NativeDecode should also handle ResourceLimit. Batches prepared by CpuBatchDecoder report items whose output allocation or planned execution cannot fit as indexed preparation errors and exclude those items from the prepared groups. Backend-neutral prepare_batch and prepare_batch_from_images retain whole-call output-cap failures for a single oversized image when subsequently decoded on the CPU. On either preparation path, groups whose combined output exceeds the allocation cap are decoded into several result groups, each with a buffer within the cap. Automatic streamed routes also allow requests that previously exceeded working-memory limits to succeed. The documented deep-sample conversion fixes make 16-bit outputs of images deeper than 16 bits hold the native sample value clamped to the 16-bit range (two's complement when signed), as scaled decodes already did, and quantize 8-bit outputs over the full component precision, correcting the prior wider-sample byte interpretation and 16-bit scaling ceiling. These preserve the output contracts and ordinary decode signatures. Adds BackendErrorKind::Decode at the end of its existing non-exhaustive enum and BackendError::decode for failures during backend decode execution. Existing discriminants and constructors are preserved. The public error documentation and changelog describe the refinements."
    hidden_rationale: "Adds set_full_decode_planes_budget as an unsupported test hook for isolated integration tests of automatic planes/streamed routing. Existing public decode methods continue choosing their routes automatically; no supported user configuration is added. All other hidden facade items are unchanged."
