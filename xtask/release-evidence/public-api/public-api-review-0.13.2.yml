    rationale: "Compared the complete ordinary API inventory against v0.13.1. Adds DecodeErrorClass::ResourceLimit { requested, cap } to an already non-exhaustive enum; no existing item changes and existing variant discriminants are preserved. AllocationTooLarge and ImageTooLarge now classify as ResourceLimit instead of the generic Backend class. This is a compatible refinement of the extensible error taxonomy: invalid-input and allocator-failure classes stay unchanged. Callers that want to handle memory limits separately can match the new variant; existing wildcard matches remain valid. Adds inspect_j2k_reference_grid and the non-exhaustive J2kCodestreamReferenceGrid it returns, a sibling of inspect_htj2k_capabilities that reports the SIZ image and tile origins the existing J2kCodestreamHeaderMetadata omits; that struct's layout is unchanged. Adds DecodingError::SinkStopped to the already non-exhaustive enum, the error a streamed region decode returns when its row sink asks it to stop; existing variants and wildcard matches are unaffected."
    hidden_rationale: "Adds referenced_classic_plan_execution_bytes and referenced_htj2k_plan_execution_bytes for sibling CPU batch adapters to check planned live execution memory before allocation. For the facade's streamed routes, j2k-native also adds decode_native_region_components_rows_with_context, full_decode_planes_floor, output_tile_rects, region_decode_streams_rows and streamed_rows_native_precision; cpu_decode_pool_threads reports the pool thread count for facade routing, DecoderContext::set_shared_pool marks CpuBatchDecoder's shared-pool images, and pack_rgb8 shares the existing pixel conversion. ComponentRowSink::rgb8_region is an optional default method, so existing sink implementations remain valid. Image::image_origin and Image::tile_grid report the SIZ origins the facade needs to size reduced outputs on the reference grid, and inspect_jp2_container_with_settings applies a decode's lenient container recoveries so facade batch preparation plans from the metadata a lenient decode uses; inspect_jp2_container keeps its strict behavior. ComponentRowSink::stopped is an optional default method returning false, so existing sinks remain valid, through which facade sinks that failed stop a streamed decode at its next hand-over. Image::region_rows_blocker and the non-exhaustive RegionRowsBlocker name the condition region_decode_streams_rows fails, which is now derived from them, and decode_region_rows_for_integer_output_with_retained_baseline charges memory concurrent tile decodes hold so they share one decode budget. at_simd_level, round_clamped_native, signed_native_bounds and unsigned_native_max share dispatched sample conversion and its bounds with sibling crates. These are unsupported implementation helpers; existing signatures are unchanged."
