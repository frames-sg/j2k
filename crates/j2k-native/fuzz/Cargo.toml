[package]
name = "j2k-native-fuzz"
version = "0.1.0"
edition = "2021"
publish = false

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"
j2k-native = { path = ".." }

[[bin]]
name = "native_decode_fuzz"
path = "fuzz_targets/native_decode_fuzz.rs"
test = false
doc = false
bench = false

[[bin]]
name = "lossless_roundtrip_fuzz"
path = "fuzz_targets/lossless_roundtrip_fuzz.rs"
test = false
doc = false
bench = false

[profile.release]
debug = 1

[workspace]
