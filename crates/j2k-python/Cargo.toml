[package]
name = "j2k-python"
description = "Rust native extension for JPEG 2000 pixels and wavelets in PyTorch and NumPy"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[lib]
name = "j2k_python"
crate-type = ["cdylib", "rlib"]
test = false
doctest = false

[features]
default = []
python = ["dep:pyo3", "dep:pyo3-build-config"]
extension-module = ["python", "pyo3/extension-module"]
cuda = ["python", "dep:j2k-cuda", "dep:j2k-cuda-runtime"]

[dependencies]
j2k = { path = "../j2k" }
j2k-native = { path = "../j2k-native" }
j2k-jpeg = { path = "../j2k-jpeg" }
pyo3 = { version = "0.30.1", features = ["abi3-py310"], optional = true }
j2k-cuda = { path = "../j2k-cuda", features = ["cuda-runtime"], optional = true }
j2k-cuda-runtime = { path = "../j2k-cuda-runtime", optional = true }

[build-dependencies]
pyo3-build-config = { version = "0.30.1", optional = true }

[lints.rust]
unsafe_op_in_unsafe_fn = "deny"

[lints.clippy]
undocumented_unsafe_blocks = "deny"
